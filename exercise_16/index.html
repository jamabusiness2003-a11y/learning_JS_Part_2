<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Fetcher (API)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather Fetcher (API)</h1>

    <div class="weather-input">
        <label for="cityInput">City Name:</label>
        <input type="text" id="cityInput" placeholder="Enter your city">
        <button id="weatherBtn">Fetch</button>
    </div>

    <div class="weather-container">
        <div class="city" id="city"></div>
        <div class="temperature" id="temp"></div>
        <img src="" id="icon">
        <div class="description" id="desc"></div>

        <div class="details">
            <div id="humidity"></div>
            <div id="wind"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
