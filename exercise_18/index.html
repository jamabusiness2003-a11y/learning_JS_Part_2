<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undo / Redo System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Undo / Redo System</h1>

        <button class="button--primary" id="actionBtn">Action</button>
        <button class="button--primary" id="undoBtn" disabled>Undo</button>
        <button class="button--primary" id="redoBtn" disabled>Redo</button>

        <div class="output" id="outputDisplay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
