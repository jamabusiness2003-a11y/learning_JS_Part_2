<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global State Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section">
        <h2 class="section__title">Counter Section</h2>
        <p class="section__text">Count: <span id="textCount">0</span></p>
        <button class="section__button" id="increaseBtn">Increase Count</button>
        <button class="section__button" id="decreaseBtn">Decrease Count</button>
    </div>

    <div class="section">
        <h2 class="section__title">Toggle Section</h2>
        <p class="section__text">Status: <span id="toggleText">OFF</span></p>
        <button class="section__button" id="toggleBtn">Toggle</button>
    </div>

    <div class="section">
        <h2 class="section__title">Text Display Section</h2>
        <p class="section__text">Message: <span id="textDisplay"></span></p>
        <button class="section__button" id="textDisplayBtn">Display Text</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
