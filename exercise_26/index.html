<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Shortcut System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Keyboad Shortcut System</h2>

        <div class="buttons">
            <button id="startBtn">
                Start <kbd>Ctrl</kbd> + <kbd>C</kbd>
            </button>
            <button id="stopBtn">
                Stop <kbd>Ctrl</kbd> + <kbd>V</kbd>
            </button>
            <button id="resetBtn">
                Reset <kbd>Ctrl</kbd> + <kbd>B</kbd>
            </button>
        </div>

        <div id="statusDisplay" class="status idle">
            Status: Idle
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
